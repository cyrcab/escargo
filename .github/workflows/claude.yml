name: Claude

# Mentionner @claude dans une issue ou une PR, et review automatique des PR.
# Prérequis : lancer /install-github-app dans Claude Code (crée le secret CLAUDE_CODE_OAUTH_TOKEN).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request:
    types: [opened, synchronize]

jobs:
  claude:
    if: |
      github.event_name == 'pull_request' ||
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ github.event_name == 'pull_request' && 'Relis cette PR selon CLAUDE.md : bugs, vie privée (aucune position GPS envoyée, pas de gares dans les classements), respect du design system. Commentaires courts, en français.' || '' }}
