name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Relis cette pull request. Lis d'abord `CLAUDE.md` à la racine et le `CLAUDE.md` du dossier
            de chaque fichier modifié : leurs règles sont le référentiel de la review.

            1. `gh pr view` pour le contexte, `gh pr diff` pour les changements. Ouvre les fichiers
               modifiés pour comprendre le code autour du diff.
            2. Cherche en priorité :
               - les bugs et cas limites (erreurs non gérées, valeurs nulles, fuseaux horaires, heures GTFS > 24 h) ;
               - les violations des règles non négociables de `CLAUDE.md` : coordonnées GPS envoyées
                 au serveur, gares dans les classements, données sensibles dans les logs, marques SNCF/IDFM,
                 couleurs en dur hors `@escargo/design-tokens`, migration écrite à la main ;
               - la logique métier hors `packages/*` ou sans test.
            3. Signale chaque problème réel avec `mcp__github_inline_comment__create_inline_comment`
               sur la ligne concernée : le problème, pourquoi, la correction. Pas de remarque de style
               que Biome gère déjà, pas de compliment.
            4. Termine par un seul commentaire de synthèse avec `gh pr comment` : verdict
               (« OK pour fusionner » ou « À corriger »), liste courte des points bloquants.

            Réponds en français, de façon concise.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
