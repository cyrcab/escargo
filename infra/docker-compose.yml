# Dev local : Postgres + Redis. Lancer avec `pnpm infra:up`.
name: escargo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: escargo
      POSTGRES_PASSWORD: escargo
      POSTGRES_DB: escargo
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escargo"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
